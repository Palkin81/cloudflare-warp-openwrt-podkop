name: Build APK (OpenWrt 25.12 x86_64)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: ['ci/**']

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/moz9/cloudflare-warp-openwrt-podkop.git

jobs:
  # Только для расписания и на main: подтянуть изменения upstream.
  # Если новых коммитов нет, сборка пропускается. Остальные запуски
  # (ручной, пуш в ветку ci/**) собирают текущий коммит.
  sync:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.sync.outputs.build }}
      ref: ${{ steps.sync.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync with upstream
        id: sync
        run: |
          set -eu
          echo "build=true" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add upstream "$UPSTREAM_REPO"
            git fetch upstream main
            if git merge-base --is-ancestor upstream/main HEAD; then
              echo "Новых коммитов в upstream нет, сборка пропущена."
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              git merge --no-edit upstream/main
              git push origin HEAD:main
            fi
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # Пакеты не привязаны к версии OpenWrt (Go-бинарники и скрипты), поэтому
      # собираем один комплект на самом свежем SDK. SHA-256 взята из официальных
      # sha256sums релиза и на каждом запуске сверяется с ними заново.
      # Новая версия SDK: поменять три строки ниже.
      SDK_VERSION: '25.12.6'
      SDK_SHA256: 1864152619092e781fa36a401960c8e9ae42d6a364c44ee5f0b197ca5f3c0fcc
      SDK_BASE: https://downloads.openwrt.org/releases/25.12.6/targets/x86/64
      SDK_ARCHIVE: openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
      SDK_DIR: openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.ref }}

      - name: Free disk space
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl perl xz-utils zstd

      - name: Download SDK and verify SHA-256
        run: |
          set -eu
          mkdir -p "$HOME/openwrt-build"
          cd "$HOME/openwrt-build"
          curl -fL --retry 3 --retry-delay 2 -o sha256sums "$SDK_BASE/sha256sums"
          OFFICIAL=$(grep -F "$SDK_ARCHIVE" sha256sums | awk '{print $1}')
          echo "official: $OFFICIAL"
          echo "pinned:   $SDK_SHA256"
          if [ "$OFFICIAL" != "$SDK_SHA256" ]; then
            echo "ОШИБКА: закреплённая SHA-256 SDK не совпала с официальной. Проверьте SDK вручную."
            exit 1
          fi
          curl -fL --retry 3 --retry-delay 2 -o "$SDK_ARCHIVE" "$SDK_BASE/$SDK_ARCHIVE"
          printf '%s  %s\n' "$SDK_SHA256" "$SDK_ARCHIVE" | sha256sum -c -
          tar --zstd -xf "$SDK_ARCHIVE"
          test -x "$SDK_DIR/scripts/feeds"

      - name: Feeds of this release and Go patch
        run: |
          set -eu
          SDK="$HOME/openwrt-build/$SDK_DIR"
          cd "$SDK"
          # feeds.conf.default из SDK закреплён на коммиты именно этого релиза,
          # поэтому отдельный файл с коммитами для каждой версии не нужен.
          echo "== feeds.conf.default из SDK $SDK_VERSION"
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # warp-awg требует Go не ниже 1.26.3. В feeds 25.12.3 стоит 1.26.2,
          # поэтому там применяем патч; если в feeds версии уже новее, патч не нужен.
          mk=feeds/packages/lang/golang/golang1.26/Makefile
          if [ ! -f "$mk" ]; then
            echo "ОШИБКА: в feeds релиза $SDK_VERSION нет $mk. Нужна другая ветка golang (проверьте feeds вручную)."
            exit 1
          fi
          cur=$(sed -n 's/^GO_VERSION_PATCH:=\([0-9][0-9]*\).*/\1/p' "$mk")
          echo "golang1.26 в feeds релиза $SDK_VERSION: GO_VERSION_PATCH=${cur:-?}"
          if [ -z "$cur" ]; then
            echo "ОШИБКА: не удалось определить GO_VERSION_PATCH в $mk."
            exit 1
          fi
          if [ "$cur" -ge 3 ]; then
            echo "Go в feeds уже 1.26.$cur (не ниже 1.26.3): патч не применяем."
          else
            git -C feeds/packages apply "$GITHUB_WORKSPACE/ci/golang-changes.patch"
            echo "Патч Go применён (1.26.$cur -> 1.26.3)."
          fi

      - name: Install WARP packages into SDK
        run: |
          set -eu
          SDK="$HOME/openwrt-build/$SDK_DIR"

          # Режимы: в коммите warp-autotune, warp-test, warp-common и warp-setup
          # записаны как 0644. LuCI/rpcd запускает warp-test и warp-autotune
          # напрямую, поэтому исполняемый бит нужен.
          chmod 0755 root/usr/libexec/* root/etc/init.d/*
          chmod 0600 root/etc/config/warp

          cp -a warp-awg warp-warpscout "$SDK/package/"

          # kmod-tun нужен только при установке пакета на роутер. Как зависимость
          # сборки (+kmod-tun в DEPENDS) он заставляет SDK собирать package/kernel/linux,
          # а вместе с ним linux-firmware (~580 МБ) и nu801. Переносим зависимость в
          # EXTRA_DEPENDS: в APK она остаётся, но сборку больше не тянет.
          # Правим копию в SDK, файл в репозитории остаётся как в upstream.
          mk="$SDK/package/warp-awg/Makefile"
          if grep -q ' +kmod-tun' "$mk"; then
            sed -i 's/ +kmod-tun//' "$mk"
            # SDK 25.12 требует у EXTRA_DEPENDS версионное ограничение, поэтому (>=0).
            sed -i '/^  DEPENDS:=/a\  EXTRA_DEPENDS:=kmod-tun (>=0)' "$mk"
          else
            echo "::warning::В warp-awg/Makefile не найдено ' +kmod-tun': upstream мог изменить зависимости, проверьте ci/ и шаг подмены."
          fi
          sed -n '/^define Package\/warp-awg$/,/^endef/p' "$mk"

          mkdir -p "$SDK/package/luci-app-warp"
          # po/ не копируем: проверенная сборка тоже была без luci-i18n-warp-ru.
          cp -a Makefile htdocs root "$SDK/package/luci-app-warp/"

      - name: Signing key
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          set -eu
          cd "$HOME/openwrt-build/$SDK_DIR"
          # Если секрет APK_SIGN_KEY задан, SDK подписывает пакеты постоянным ключом
          # (EC prime256v1, PEM). Публичная часть выводится из приватной.
          if [ -n "$APK_SIGN_KEY" ]; then
            umask 077
            printf '%s\n' "$APK_SIGN_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Ключ подписи из секрета подставлен в SDK."
          else
            echo "::notice::Секрет APK_SIGN_KEY не задан: пакеты не подписываются постоянным ключом (на роутере нужен --allow-untrusted)."
          fi

      - name: Minimal SDK config
        run: |
          set -eu
          cd "$HOME/openwrt-build/$SDK_DIR"
          # Конфиг SDK по умолчанию включает CONFIG_ALL/ALL_KMODS. Это раздувает
          # список пакетов до тысяч (в старом sdk.config их было 10911) и тянет
          # лишние загрузки вроде linux-firmware. Оставляем только нужное.
          # В свежераспакованном SDK файла .config нет (первый запуск упал на этом),
          # поэтому создаём пустой; значения по умолчанию добавит make defconfig.
          touch .config
          sed -i -E '/^(# )?CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED)([= ]|$)/d' .config
          cat >> .config <<'EOF'
          # CONFIG_ALL is not set
          # CONFIG_ALL_KMODS is not set
          # CONFIG_ALL_NONSHARED is not set
          CONFIG_PACKAGE_warp-awg=m
          CONFIG_PACKAGE_warp-warpscout=m
          CONFIG_PACKAGE_luci-app-warp=m
          EOF
          make defconfig
          n=$(grep -c '=m$' .config || true)
          echo "Пакетов с =m после defconfig: $n"
          if [ "$n" -gt 2000 ]; then
            echo "ОШИБКА: конфигурация снова раздулась до $n пакетов."
            exit 1
          fi

      - name: Build warp-awg
        run: |
          cd "$HOME/openwrt-build/$SDK_DIR"
          make package/warp-awg/compile V=s -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/logs/warp-awg.log" | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
          echo "dl/: $(du -sh dl | cut -f1)"
          ls -laS dl | head -12
          if ls dl | grep -q '^linux-firmware'; then
            echo "::warning::linux-firmware всё ещё скачивается при сборке warp-awg (замена зависимости kmod-tun не помогла)."
          fi
          # Ищем именно вход в каталог пакета: просто строка package/kernel/linux
          # встречается и в безобидных сообщениях feeds (ложное срабатывание).
          if grep -q -E "Entering directory .*(package/kernel/linux|firmware/linux-firmware)" "$GITHUB_WORKSPACE/logs/warp-awg.log"; then
            echo "::warning::При сборке warp-awg запускалась сборка package/kernel/linux или linux-firmware."
          fi

      - name: Build warp-warpscout
        run: |
          cd "$HOME/openwrt-build/$SDK_DIR"
          make package/warp-warpscout/compile V=s -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/logs/warp-warpscout.log" | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Build luci-app-warp
        run: |
          cd "$HOME/openwrt-build/$SDK_DIR"
          make package/luci-app-warp/compile V=s -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/logs/luci-app-warp.log" | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
          echo "dl/: $(du -sh dl | cut -f1)"

      - name: Collect and check packages
        run: |
          set -eu
          SDK="$HOME/openwrt-build/$SDK_DIR"
          mkdir -p out
          for p in warp-awg warp-warpscout luci-app-warp; do
            f=$(find "$SDK/bin/packages" -type f -name "$p-*.apk" -print -quit)
            [ -n "$f" ] || { echo "ОШИБКА: нет APK для $p"; exit 1; }
            cp -f "$f" out/
          done
          # Публичный ключ кладём рядом только для постоянного ключа: его нужно один раз
          # положить на роутер в /etc/apk/keys. Одноразовый ключ SDK бесполезен.
          if [ "${SIGNED:-}" = true ]; then cp -f "$SDK/public-key.pem" out/; fi
          bash ci/check-packages.sh "$SDK" "$GITHUB_WORKSPACE/out"

      - name: Sign and verify packages
        run: |
          set -eu
          SDK="$HOME/openwrt-build/$SDK_DIR"
          APK="$SDK/staging_dir/host/bin/apk"
          # SDK подписывает только индекс репозитория (mkndx), отдельные APK остаются
          # без подписи, поэтому подписываем их сами. adbsign сначала открывает файл и
          # без --allow-untrusted портит неподписанный пакет (проверено пробным прогоном).
          if [ "${SIGNED:-}" = true ]; then
            key="$SDK/private-key.pem"; pub="$SDK/public-key.pem"; target="$GITHUB_WORKSPACE/out"
          else
            # Секрета нет: проверяем схему на копии с одноразовым ключом, чтобы после
            # добавления секрета она заведомо работала. Готовые пакеты не меняются.
            T=$(mktemp -d)
            openssl ecparam -genkey -name prime256v1 -noout -out "$T/k.pem"
            openssl ec -in "$T/k.pem" -pubout -out "$T/p.pem"
            mkdir "$T/pkg"; cp out/*.apk "$T/pkg/"
            key="$T/k.pem"; pub="$T/p.pem"; target="$T/pkg"
          fi
          mkdir -p "$GITHUB_WORKSPACE/keys"; cp "$pub" "$GITHUB_WORKSPACE/keys/signer.pem"
          for f in "$target"/*.apk; do
            "$APK" adbsign --allow-untrusted --sign-key "$key" "$f"
            "$APK" verify --keys-dir "$GITHUB_WORKSPACE/keys" "$f"
            # Чужой ключ проходить не должен.
            O=$(mktemp -d); openssl ecparam -genkey -name prime256v1 -noout -out "$O/o.pem"
            openssl ec -in "$O/o.pem" -pubout -out "$O/signer.pem" 2>/dev/null
            if "$APK" verify --keys-dir "$O" "$f" >/dev/null 2>&1; then
              echo "ОШИБКА: $f проходит проверку чужим ключом"; exit 1
            fi
          done
          if [ "${SIGNED:-}" = true ]; then
            (cd out && sha256sum ./*.apk | sed 's# \./# #' > SHA256SUMS)
            echo "Пакеты подписаны и проверены."
          else
            echo "Пробная подпись и проверка прошли успешно (готовые пакеты не изменены)."
          fi

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: warp-apk-x86_64
          path: |
            out/
            logs/
          if-no-files-found: warn
          retention-days: 30

  # Релиз публикуется только для запусков на main (расписание или ручной).
  # Сборки из веток ci/** остаются артефактами.
  release:
    needs: [sync, build]
    if: needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: warp-apk-x86_64
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.sync.outputs.ref }}
        run: |
          set -eu
          short=$(printf '%s' "$REF" | cut -c1-7)
          tag="build-$short"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиз $tag уже существует, пропускаем."
            exit 0
          fi
          cd artifacts/out
          ls -la
          if [ -f public-key.pem ]; then
            how="Пакеты подписаны: один раз положите public-key.pem в /etc/apk/keys/ на роутере, затем apk add ./*.apk."
          else
            how="Пакеты не подписаны постоянным ключом: ставить через apk add --allow-untrusted ./*.apk."
          fi
          gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "WARP для OpenWrt x86_64, сборка $short" \
            --notes "Коммит $REF. Один комплект APK для OpenWrt 25.12.x (x86_64). $how Контрольные суммы: SHA256SUMS."
