name: Sign test
on:
  push:
    branches: ['signtest']
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - name: Try signing variants
        run: |
          set -u
          B=https://downloads.openwrt.org/releases/25.12.6/targets/x86/64
          A=openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          curl -sfL -o "$A" "$B/$A"
          tar --zstd -xf "$A"
          APK=$(pwd)/$(ls -d openwrt-sdk-*/ | head -1)staging_dir/host/bin/apk
          "$APK" --version
          SD=$(pwd)/$(ls -d openwrt-sdk-*/ | head -1)
          echo "== как SDK зовёт mkpkg / подпись"
          grep -n -i "mkpkg\|BUILD_KEY_APK\|SIGNED_PACKAGES\|adbsign\|mkndx" "$SD"/include/package-pack.mk "$SD"/include/package-ipkg.mk "$SD"/package/Makefile "$SD"/Config.in "$SD"/rules.mk 2>/dev/null | cut -c1-240
          ls -la "$SD"/*.pem 2>&1 | head
          W=$(mktemp -d); cd "$W"
          openssl ecparam -genkey -name prime256v1 -noout -out k.pem
          openssl ec -in k.pem -pubout -out p.pem
          mkdir -p src abskeys; echo hi > src/f; cp p.pem abskeys/p.pem
          "$APK" mkpkg --info name:t --info version:1-r1 --info arch:noarch --files src --output t.apk
          "$APK" verify --keys-dir "$W/abskeys" t.apk; echo "до подписи rc=$? (ожидаем 1)"
          "$APK" adbsign --allow-untrusted --sign-key k.pem t.apk; echo "adbsign rc=$?"
          "$APK" verify --keys-dir "$W/abskeys" t.apk; echo "после подписи rc=$? (ожидаем 0)"
          "$APK" verify --keys-dir "$W/abskeys" --allow-untrusted t.apk; echo "rc=$?"
          echo "== повторная подпись тем же ключом"
          "$APK" adbsign --allow-untrusted --sign-key k.pem t.apk; "$APK" verify --keys-dir "$W/abskeys" t.apk; echo "rc=$?"
          echo "== чужой ключ не должен проходить"
          openssl ecparam -genkey -name prime256v1 -noout -out o.pem; openssl ec -in o.pem -pubout -out o.pub 2>/dev/null
          mkdir -p otherkeys; cp o.pub otherkeys/; "$APK" verify --keys-dir "$W/otherkeys" t.apk; echo "rc=$? (ожидаем 1)"
          echo "== установка с доверенным ключом в корне (как на роутере)"
          mkdir -p r/etc/apk/keys; cp p.pem r/etc/apk/keys/
          "$APK" --root "$W/r" --initdb add --no-scripts --no-network t.apk; echo "rc=$?"
